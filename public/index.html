<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello Claw // Neon Grid</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #03040a;
      --panel: rgba(6, 10, 20, 0.68);
      --line: rgba(120, 255, 248, 0.18);
      --text: #e7fbff;
      --muted: rgba(231, 251, 255, 0.7);
      --cyan: #4de9ff;
      --pink: #ff4fd8;
      --violet: #8b5cf6;
      --lime: #a3ff12;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 45%, rgba(77, 233, 255, 0.08), transparent 18%),
        linear-gradient(180deg, #02030a 0%, #050816 46%, #02030a 100%);
      overflow: hidden;
    }

    .scanlines,
    .noise,
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .scanlines {
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 2px,
        transparent 4px
      );
      mix-blend-mode: soft-light;
      opacity: 0.28;
    }

    .noise {
      opacity: 0.05;
      background-image: linear-gradient(rgba(15,23,42,0.6) 1px, transparent 1px), linear-gradient(90deg, rgba(15,23,42,0.6) 1px, transparent 1px);
      background-size: 32px 32px;
      mix-blend-mode: overlay;
    }

    .vignette {
      background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.55) 100%);
    }

    .grid {
      position: fixed;
      inset: -20%;
      background:
        linear-gradient(rgba(14, 165, 233, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14, 165, 233, 0.18) 1px, transparent 1px),
        linear-gradient(rgba(15,23,42,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15,23,42,0.05) 1px, transparent 1px);
      background-size: 72px 72px, 72px 72px, 18px 18px, 18px 18px;
      background-position: 0 0, 0 0, 0 0, 0 0;
      transform: perspective(1200px) rotateX(74deg) translateY(20%);
      transform-origin: center;
      mask-image: radial-gradient(circle at center, black 28%, transparent 78%);
      animation: wireframe 16s linear infinite;
      opacity: 0.6;
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(12px);
      animation: float 12s ease-in-out infinite;
      opacity: 0.25;
    }

    .glow.a {
      width: 240px;
      height: 240px;
      left: 8%;
      top: 14%;
      background: radial-gradient(circle, rgba(77, 233, 255, 0.95), rgba(77, 233, 255, 0.02));
      box-shadow: 0 0 60px rgba(77, 233, 255, 0.25);
    }

    .glow.b {
      width: 300px;
      height: 300px;
      right: 2%;
      top: 8%;
      background: radial-gradient(circle, rgba(255, 79, 216, 0.85), rgba(255, 79, 216, 0.02));
      animation-duration: 16s;
      animation-delay: -4s;
      box-shadow: 0 0 70px rgba(255, 79, 216, 0.2);
    }

    .glow.c {
      width: 220px;
      height: 220px;
      left: 58%;
      bottom: -4%;
      background: radial-gradient(circle, rgba(163, 255, 18, 0.55), rgba(163, 255, 18, 0.02));
      animation-duration: 14s;
      animation-delay: -8s;
      box-shadow: 0 0 50px rgba(163, 255, 18, 0.12);
    }

    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .frame {
      width: min(860px, 100%);
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      box-shadow:
        0 0 0 1px rgba(77, 233, 255, 0.08) inset,
        0 24px 90px rgba(0, 0, 0, 0.48);
      position: relative;
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 26px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(77,233,255,0.45), rgba(255,79,216,0.34), rgba(163,255,18,0.22));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.8;
    }

    .panel {
      border-radius: 20px;
      background: var(--panel);
      backdrop-filter: blur(18px) saturate(145%);
      padding: clamp(2rem, 5vw, 4.2rem);
      position: relative;
      overflow: hidden;
    }

    .panel::after {
      content: "";
      position: absolute;
      inset: -40% -20%;
      background: linear-gradient(115deg, transparent 35%, rgba(77, 233, 255, 0.08) 50%, transparent 65%);
      transform: translateX(-40%);
      animation: sweep 6.5s ease-in-out infinite;
      pointer-events: none;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      color: var(--muted);
      font-size: 0.92rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
    }

    .led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 18px rgba(163, 255, 18, 0.9);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .tag {
      padding: 0.45rem 0.8rem;
      border: 1px solid rgba(77, 233, 255, 0.22);
      border-radius: 999px;
      background: rgba(255,255,255,0.65);
      color: rgba(231, 251, 255, 0.82);
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 12vw, 8rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
      text-transform: uppercase;
      text-shadow:
        0 0 12px rgba(77, 233, 255, 0.38),
        0 0 32px rgba(255, 79, 216, 0.18);
      position: relative;
      display: inline-block;
      animation: titleFlicker 3.8s infinite steps(1, end);
    }

    h1::before,
    h1::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      mix-blend-mode: screen;
    }

    h1::before {
      transform: translate(2px, 0);
      color: rgba(77, 233, 255, 0.85);
      clip-path: inset(0 0 56% 0);
      animation: glitchTop 2.8s infinite linear alternate-reverse;
    }

    h1::after {
      transform: translate(-2px, 0);
      color: rgba(255, 79, 216, 0.82);
      clip-path: inset(48% 0 0 0);
      animation: glitchBottom 2.1s infinite linear alternate-reverse;
    }

    .subtitle {
      margin: 1.1rem 0 0;
      max-width: 46rem;
      color: var(--muted);
      line-height: 1.7;
      font-size: clamp(1rem, 2vw, 1.15rem);
    }

    .chips {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-top: 1.8rem;
    }

    .chip {
      padding: 0.65rem 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(77, 233, 255, 0.18);
      background: rgba(8, 12, 24, 0.7);
      color: rgba(231, 251, 255, 0.84);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03) inset;
    }

    .bars {
      margin-top: 2rem;
      display: flex;
      gap: 0.5rem;
      align-items: end;
      height: 56px;
    }

    .bar {
      width: 10px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--cyan), var(--pink));
      box-shadow: 0 0 18px rgba(77, 233, 255, 0.2);
      animation: equalize 1.8s ease-in-out infinite;
    }

    .bar:nth-child(2) { animation-delay: 0.15s; }
    .bar:nth-child(3) { animation-delay: 0.3s; }
    .bar:nth-child(4) { animation-delay: 0.45s; }
    .bar:nth-child(5) { animation-delay: 0.6s; }
    .bar:nth-child(6) { animation-delay: 0.75s; }

    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: rgba(77, 233, 255, 0.45);
      border-style: solid;
      filter: drop-shadow(0 0 8px rgba(77, 233, 255, 0.18));
    }

    .corner.tl { left: 14px; top: 14px; border-width: 2px 0 0 2px; }
    .corner.tr { right: 14px; top: 14px; border-width: 2px 2px 0 0; }
    .corner.bl { left: 14px; bottom: 14px; border-width: 0 0 2px 2px; }
    .corner.br { right: 14px; bottom: 14px; border-width: 0 2px 2px 0; }

    @keyframes float {
      0%, 100% { transform: translate3d(0,0,0) scale(1); }
      50% { transform: translate3d(0,-22px,0) scale(1.06); }
    }

    @keyframes wireframe {
      from { background-position: 0 0, 0 0, 0 0, 0 0; }
      to { background-position: 72px 72px, -72px 72px, 18px 18px, -18px 18px; }
    }

    @keyframes sweep {
      0%, 45% { transform: translateX(-42%) skewX(-15deg); opacity: 0; }
      55% { opacity: 0.9; }
      100% { transform: translateX(42%) skewX(-15deg); opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }

    @keyframes titleFlicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.78; }
      94% { opacity: 1; }
      96% { opacity: 0.88; }
      97% { opacity: 1; }
    }

    @keyframes glitchTop {
      0% { clip-path: inset(0 0 58% 0); transform: translate(2px, 0); }
      20% { clip-path: inset(8% 0 48% 0); transform: translate(4px, -1px); }
      40% { clip-path: inset(0 0 62% 0); transform: translate(1px, 1px); }
      60% { clip-path: inset(5% 0 44% 0); transform: translate(5px, 0); }
      80% { clip-path: inset(2% 0 54% 0); transform: translate(3px, -1px); }
      100% { clip-path: inset(0 0 58% 0); transform: translate(2px, 0); }
    }

    @keyframes glitchBottom {
      0% { clip-path: inset(46% 0 0 0); transform: translate(-2px, 0); }
      25% { clip-path: inset(52% 0 0 0); transform: translate(-5px, 1px); }
      50% { clip-path: inset(40% 0 0 0); transform: translate(-1px, -1px); }
      75% { clip-path: inset(56% 0 0 0); transform: translate(-4px, 0); }
      100% { clip-path: inset(46% 0 0 0); transform: translate(-2px, 0); }
    }

    @keyframes equalize {
      0%, 100% { height: 16px; }
      50% { height: 54px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow a"></div>
  <div class="glow b"></div>
  <div class="glow c"></div>
  <div class="scanlines"></div>
  <div class="noise"></div>
  <div class="vignette"></div>

  <main>
    <section class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="panel">
        <div class="hud">
          <div class="status"><span class="led"></span> SYSTEM ONLINE</div>
          <div class="tag">PORT 8080 / READY</div>
        </div>

        <h1 data-text="Hi
Claw">Hi<br>Claw</h1>
        <p class="subtitle">
          Hi Claw.
        </p>

        <div class="chips">
          <span class="chip">Cyberpunk UI</span>
          <span class="chip">Animated background</span>
          <span class="chip">Glass panel</span>
        </div>

        <div class="bars" aria-hidden="true">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
